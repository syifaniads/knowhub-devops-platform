version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    ports:
      - "80:80"
    networks:
      - internal-net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    entrypoint:
      - /bin/sh
      - -c
      - export DATABASE_URL=$$(cat /run/secrets/db_url) && ./entrypoint.sh
    networks:
      - internal-net
    secrets:
      - db_url
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal-net
    secrets:
      - postgres_user
      - postgres_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:v3.5.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - internal-net
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker

  grafana:
    image: grafana/grafana:12.1.1
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal-net
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker

  node-exporter:
    image: prom/node-exporter:v1.9.1
    networks:
      - internal-net
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker

configs:
  prometheus_config:
    file: ./prometheus.yml

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  db_url:
    external: true

networks:
  internal-net:
    driver: overlay

volumes:
  pgdata:
  grafana_data:
